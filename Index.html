<!doctype html>
<html lang="ja"><head><base target="_top"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:15px;box-shadow:0 5px 18px #1b355315}h1{font-size:24px;margin:4px 0 18px}h2{font-size:18px;margin:0 0 14px}input,select,textarea,button{font:inherit;width:100%;padding:13px;border:1px solid #cad3df;border-radius:11px;margin:5px 0 10px}button{border:0;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e8eef7;color:#243247}.danger{background:#dc2626}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.punches{grid-template-columns:1fr 1fr}.muted{color:#697386;font-size:13px}.status{padding:11px;border-radius:10px;background:#eef6ff;margin:8px 0}.hidden{display:none}.tabs{display:flex;gap:7px;margin-bottom:14px}.tabs button{padding:10px 5px;background:#e8eef7;color:#243247}.tabs button.on{background:#2563eb;color:#fff}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left}.scroll{overflow:auto}.bigtime{text-align:center;font-size:28px;font-weight:700;margin:8px}@media(max-width:540px){.grid{grid-template-columns:1fr}.punches{grid-template-columns:1fr 1fr}.wrap{padding:10px}.card{padding:16px}}
</style></head><body><div class="wrap">
<div id="login" class="card"><h1>勤怠管理</h1><input id="employeeId" placeholder="社員番号" autocomplete="username"><input id="pin" type="password" placeholder="PIN" autocomplete="current-password"><button onclick="signIn()">ログイン</button><div id="loginMsg" class="muted"></div></div>
<div id="app" class="hidden"><div class="card"><div id="welcome"></div><div class="tabs"><button class="on" onclick="tab('punch',this)">打刻</button><button onclick="tab('summary',this)">月次</button><button id="adminTab" class="hidden" onclick="tab('admin',this)">管理</button><button onclick="logout()">終了</button></div></div>
<section id="punch" class="pane"><div class="card"><div id="clock" class="bigtime"></div><div id="todayShift" class="status">読込中...</div><div class="grid punches"><button onclick="doPunch('出勤')">出勤</button><button class="danger" onclick="doPunch('退勤')">退勤</button><button class="secondary" onclick="doPunch('休憩開始')">休憩開始</button><button class="secondary" onclick="doPunch('休憩終了')">休憩終了</button></div><div id="punchMsg"></div><div id="todayLog" class="muted"></div></div></section>
<section id="summary" class="pane hidden"><div class="card"><h2>月次集計</h2><input id="month" type="month"><button onclick="loadSummary()">表示</button><div id="totals" class="status"></div><div class="scroll"><table><thead><tr><th>日付</th><th>出勤</th><th>退勤</th><th>勤務</th><th>状態</th></tr></thead><tbody id="days"></tbody></table></div></div></section>
<section id="admin" class="pane hidden"><div class="card"><h2>シフト登録</h2><div class="grid"><input id="shiftDate" type="date"><input id="shiftEmp" placeholder="社員番号"><input id="shiftStart" type="time"><input id="shiftEnd" type="time"><input id="shiftBreak" type="number" value="60" placeholder="休憩分"><select id="dayType"><option>所定労働日</option><option>所定休日</option><option>法定休日</option></select></div><textarea id="shiftNote" placeholder="備考"></textarea><button onclick="saveShift()">シフトを保存</button><div id="adminMsg"></div></div><div class="card"><h2>従業員追加</h2><div class="grid"><input id="newId" placeholder="社員番号"><input id="newName" placeholder="氏名"><input id="newPin" placeholder="初期PIN（6文字以上）"><select id="newRole"><option>従業員</option><option>管理者</option></select></div><button onclick="addEmployee()">追加</button></div><div class="card"><h2>freee CSV</h2><input id="csvMonth" type="month"><button onclick="downloadCsv()">CSVを作成</button><p class="muted">freee人事労務の「勤怠サマリー」からfreee形式として取り込みます。</p></div></section>
</div></div><script>
let auth=null;const $=id=>document.getElementById(id);const nowMonth=()=>new Date().toISOString().slice(0,7);$('month').value=nowMonth();$('csvMonth').value=nowMonth();$('shiftDate').value=new Date().toISOString().slice(0,10);setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('ja-JP'),1000);
function call(name,args,ok,msgId){if(msgId)$(msgId).textContent='処理中...';google.script.run.withSuccessHandler(r=>{if(msgId)$(msgId).textContent='';ok&&ok(r)}).withFailureHandler(e=>{if(msgId)$(msgId).textContent=e.message||e;else alert(e.message||e)})[name](...args)}
function signIn(){call('login',[$('employeeId').value,$('pin').value],u=>{auth={id:$('employeeId').value,pin:$('pin').value,user:u};$('login').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent=u.name+' さん';if(u.role==='管理者')$('adminTab').classList.remove('hidden');refresh()},'loginMsg')}
function logout(){auth=null;location.reload()}
function tab(id,b){document.querySelectorAll('.pane').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(id==='summary')loadSummary()}
function refresh(){call('getDashboard',[auth.id,auth.pin],d=>{const s=d.shift;$('todayShift').textContent=s?`本日のシフト ${s.start}〜${s.end}（休憩${s.breakMinutes}分）`:'本日のシフトは未登録です';$('todayLog').innerHTML=d.punches.map(p=>`${p.time.slice(11)} ${p.type}`).join('<br>')||'本日の打刻はありません'})}
function doPunch(t){if(!confirm(t+'を記録しますか？'))return;call('punch',[auth.id,auth.pin,t],r=>{$('punchMsg').className='status';$('punchMsg').textContent=r.message+' '+r.time;refresh()},'punchMsg')}
function loadSummary(){call('getMonthlySummary',[auth.id,auth.pin,$('month').value,''],r=>{$('totals').textContent=`勤務 ${hm(r.totals.workMinutes)} / 残業 ${hm(r.totals.overtimeMinutes)} / 深夜 ${hm(r.totals.nightMinutes)}`;$('days').innerHTML=r.days.map(d=>`<tr><td>${d.date.slice(5)}</td><td>${d.clockIn.slice(11,16)}</td><td>${d.clockOut.slice(11,16)}</td><td>${hm(d.workMinutes)}</td><td>${d.status}</td></tr>`).join('')})}
function saveShift(){const s={date:$('shiftDate').value,employeeId:$('shiftEmp').value,start:$('shiftStart').value,end:$('shiftEnd').value,breakMinutes:$('shiftBreak').value,dayType:$('dayType').value,note:$('shiftNote').value};call('saveShift',[auth.id,auth.pin,s],()=>{$('adminMsg').textContent='保存しました'},'adminMsg')}
function addEmployee(){const e={id:$('newId').value,name:$('newName').value,pin:$('newPin').value,role:$('newRole').value};call('addEmployee',[auth.id,auth.pin,e],()=>alert('追加しました'))}
function downloadCsv(){call('exportFreeeCsv',[auth.id,auth.pin,$('csvMonth').value],r=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([r.content],{type:'text/csv;charset=utf-8'}));a.download=r.filename;a.click();URL.revokeObjectURL(a.href)})}
function hm(m){return Math.floor(m/60)+'時間'+m%60+'分'}
</script></body></html>
